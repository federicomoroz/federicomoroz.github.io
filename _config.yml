title: Federico Moroz
tagline: Backend Developer — APIs, integraciones y sistemas distribuidos
description: >-
  Portfolio de Federico Moroz. Backend, integraciones de APIs y
  sistemas distribuidos: proyectos, write-ups tecnicos y CV.
url: https://federicomoroz.github.io

# El repo se llama federicomoroz.github.io, asi que Pages lo sirve como user
# site: en la raiz del dominio, sin subpath. De ahi el baseurl vacio.
baseurl: ""

author:
  name: Federico Moroz
  github: federicomoroz
  linkedin: https://linkedin.com/in/federico-moroz-1760a2241/

repository: federicomoroz/federicomoroz.github.io

permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: es
  - scope:
      path: "es"
    values:
      layout: default
      lang: es
  - scope:
      path: "en"
    values:
      layout: default
      lang: en

exclude:
  - diagramas/README.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - MAINTAIN.md
  - .gitignore

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag

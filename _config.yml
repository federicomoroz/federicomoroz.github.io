title: Federico Moroz
tagline: Backend Developer — APIs, integraciones y sistemas distribuidos
description: >-
  Portfolio de Federico Moroz. Backend, integraciones de APIs y
  sistemas distribuidos: proyectos, write-ups tecnicos y CV.
url: https://federicomoroz.github.io

# Este sitio vive en el repo de perfil (federicomoroz/federicomoroz), asi que
# GitHub Pages lo sirve bajo un subpath. Si algun dia se muda a un repo
# `federicomoroz.github.io`, poner baseurl: "" y listo.
baseurl: "/federicomoroz"

author:
  name: Federico Moroz
  github: federicomoroz
  linkedin: https://linkedin.com/in/federico-moroz-1760a2241/

repository: federicomoroz/federicomoroz

permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: es
  - scope:
      path: "es"
    values:
      layout: default
      lang: es
  - scope:
      path: "en"
    values:
      layout: default
      lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - MAINTAIN.md
  - .gitignore

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag

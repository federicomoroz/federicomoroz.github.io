- years: "2024 – 2026"
  years_en: "2024 – 2026"
  title:
    es: "Desarrollador backend e ingeniero de automatización en Del Mundo a Tus Manos"
    en: "Backend developer and automation engineer at Del Mundo a Tus Manos"
  short:
    es: "La plataforma operativa de un e-commerce internacional. Un proceso de 10 minutos pasó a 5 segundos."
    en: "The operations platform of an international e-commerce business. A 10-minute process went down to 5 seconds."
  long:
    es: "Diseñé y mantuve la plataforma operativa de un e-commerce internacional, junto al equipo que la usaba todos los días: 11 tablas, unos 115.000 registros, 48 automatizaciones e integraciones con Amazon, Mercado Libre, Tienda Nube y el organismo fiscal a través de n8n. Un proceso de 10 minutos pasó a 5 segundos, sobre unas 2.100 transacciones por mes."
    en: "I designed and maintained the operations platform of an international e-commerce business, alongside the team that used it every day: 11 tables, about 115,000 records, 48 automations, and integrations with Amazon, Mercado Libre, Tienda Nube and the tax authority through n8n. A 10-minute process went down to 5 seconds, across about 2,100 transactions a month."


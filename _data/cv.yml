# Contenido derivado del CV. Subconjunto CURADO: sin datos personales
# (direccion, telefono, email, documento). La fuente de verdad es el store
# de CVs (../Cv/store/); este archivo es la proyeccion publica, a mano.
#
# COMO LLENARLO: `python ../Cv/cvq.py gather backend` devuelve el briefing;
# de ahi se baja lo que sea `visibilidad: publico` y no tenga PII.
#
# ESTADO: seed inicial. `profile` y `skills` salieron del README publico de
# GitHub. Todo lo marcado TODO lo tiene que completar Federico.

profile:
  es: |
    Backend developer enfocado en **APIs, integraciones y sistemas
    distribuidos**. Construyo sistemas correctos por diseño: **arquitectura por
    capas**, contratos explícitos entre componentes y **tests que verifican
    comportamiento, no implementación**. Trabajo sobre todo con **Python
    (FastAPI, SQLAlchemy, Pydantic)** sobre **Redis, PostgreSQL y Docker**:
    colas de tareas distribuidas, gateways de API con circuit breakers y
    motores de notificación multi-canal. También integro **APIs externas a
    escala**.
  en: |
    Backend developer focused on **APIs, integrations and distributed
    systems**. I build systems that are correct by design: **layered
    architecture**, explicit contracts between components, and **tests that
    verify behavior rather than implementation**. I work mostly with **Python
    (FastAPI, SQLAlchemy, Pydantic)** on top of **Redis, PostgreSQL and
    Docker**: distributed task queues, API gateways with circuit breakers and
    multi-channel notification engines. I also integrate **external APIs at
    scale**.

# Como trabajo — bullets cortos, descriptivos, en primera persona.
# Sin comparaciones con la industria ni auto-apreciaciones ("poco comun",
# "unico"): se statean hechos y el lector juzga.
#
# Cada bullet se sostiene con codigo publico: las capas y los puertos en
# shipping-quote, el bus de eventos en rate-guardian y notify-router, el
# composition root en dollar-tracker y task-queue.
way_of_working:
  es: |
    - **Arquitectura por capas con contratos explícitos.** La capa de transporte no conoce la de datos, y si dos módulos hablan, el contrato está escrito: un puerto o una interfaz, no un import directo.
    - **Composición sobre herencia.** La lógica se arma como pipeline de pasos, cada uno con una responsabilidad; sumar un paso no obliga a tocar los que ya andan.
    - **Los componentes se comunican por eventos**, no importándose entre sí. El gateway nunca importa al logger.
    - **Tests que verifican comportamiento, no implementación.** Un refactor no debería romper la suite; si la rompe, el test estaba mirando el lugar equivocado.
    - **Las dependencias se arman en un composition root**, no se resuelven adentro de quien las usa. Eso es lo que deja testear cada pieza sin levantar el sistema entero.
    - **Configuración por variables de entorno**, validada antes del deploy.
    - **Sin números inventados.** Si no hay una métrica medida, lo describo cualitativamente: un número que no se sostiene se cae en la primera repregunta.
  en: |
    - **Layered architecture with explicit contracts.** The transport layer knows nothing about the data layer, and if two modules talk, the contract is written down: a port or an interface, not a direct import.
    - **Composition over inheritance.** Logic is built as a pipeline of steps, each with one responsibility; adding a step doesn't mean touching the ones already working.
    - **Components talk through events** instead of importing each other. The gateway never imports the logger.
    - **Tests that verify behavior, not implementation.** A refactor shouldn't break the suite; if it does, the test was watching the wrong thing.
    - **Dependencies are wired in a composition root**, not resolved inside whoever uses them. That is what makes each piece testable without standing up the whole system.
    - **Configuration through environment variables**, validated before deploy.
    - **No invented numbers.** With no measured metric I describe things qualitatively: a number that doesn't hold up collapses at the first follow-up question.

# Habilidades tecnicas agrupadas por area. Los items son iguales en ambos
# idiomas; solo cambia la etiqueta del grupo.

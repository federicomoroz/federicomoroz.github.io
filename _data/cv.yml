      es: Lenguajes
      en: Languages
    items: [Python, JavaScript, "C#", SQL, PHP]

  - group:
      es: Backend y frameworks
      en: Backend & frameworks
    items: [FastAPI, Flask, Node.js, SQLAlchemy, Pydantic, Alembic, dependency-injector, APScheduler, httpx, Laravel, Django]

  - group:
      es: IA aplicada
      en: Applied AI
    items: [Claude API, RAG, Qdrant, "Búsqueda vectorial", Guardrails, LLM-as-Judge, "Prompt caching", "SSE streaming", Langfuse, n8n]

  - group:
      es: Infraestructura
      en: Infrastructure
    items: [Redis, PostgreSQL, SQLite, Docker, "Docker Compose", "GitHub Actions", CI/CD, Render]

  - group:
      es: Integraciones
      en: Integrations
    items: [REST APIs, Webhooks, SendGrid, Telegram Bot API, Airtable, BigQuery]

  - group:
      es: Testing y herramientas

# de CVs (../Cv/store/); este archivo es la proyeccion publica, a mano.
#
# Telefono y email NO van aca igual, pero por otra razon que antes: el sitio los
# toma de `site.author` (_config.yml), que es donde vive la identidad. Este
# archivo proyecta el CV, no la ficha de contacto. Direccion y documento no van
# a ningun lado.
#
# COMO LLENARLO: `python ../Cv/cvq.py gather backend` devuelve el briefing;
# de ahi se baja lo que sea `visibilidad: publico` y no tenga PII.
#
# ESTADO: seed inicial. `profile` y `skills` salieron del README publico de
# GitHub. Todo lo marcado TODO lo tiene que completar Federico.

# NEGRITA: como maximo tres tramos, y solo lo que alguien deberia llevarse si
# lee tres palabras. La version anterior tenia el 33% del parrafo en negrita
# repartido en 16 tramos: resaltar todo es no resaltar nada, y de paso se lee
# como esfuerzo por convencer. Los stacks no van en negrita, que ya estan
# listados como chips justo abajo.
profile:
  es: |
    Construyo **sistemas con IA que se pueden auditar**, y el backend que los
    sostiene. Escribo el flujo a mano y llamo al modelo solo donde hace falta:
    el modelo propone y reglas fijas deciden antes de que se ejecute nada. Uso
    RAG sobre Qdrant para traer contexto real, y la calidad del modelo se mide
    en CI, que bloquea el merge si empeora.

    Del lado del backend trabajo en Python con FastAPI, en C# con ASP.NET Core
    y en Java con Spring Boot, sobre PostgreSQL, MySQL, Redis y Kafka. En Nexo,
    la misma suite de contrato verifica cuatro motores de base intercambiables.
    En Order Outbox, el pedido y su evento se guardan en un mismo commit, así
    ninguno se pierde si Kafka se cae.
  en: |
    I build **AI systems that can be audited**, and the backend that runs them.
    I write the flow by hand and call the model only where it is needed: the
    model proposes and fixed rules decide before anything runs. I use RAG over
    Qdrant to bring in real context, and the model's quality is measured in CI,
    which blocks the merge if it gets worse.

    On the backend side I work in Python with FastAPI, in C# with ASP.NET Core
    and in Java with Spring Boot, on PostgreSQL, MySQL, Redis and Kafka. In
    Nexo, one contract suite verifies four interchangeable database engines.
    In Order Outbox, the order and its event are saved in the same commit, so
    neither is lost if Kafka goes down.

# Como trabajo — bullets cortos, descriptivos, en primera persona.
# Sin comparaciones con la industria ni auto-apreciaciones ("poco comun",
# "unico"): se statean hechos y el lector juzga.
#
# Cada bullet se sostiene con codigo publico: las capas y los puertos en
# shipping-quote, el bus de eventos en rate-guardian y notify-router, el
# composition root en dollar-tracker y task-queue.
way_of_working:
  es: |
    - **Capas con contratos escritos.** La capa de transporte no conoce la de datos. Cuando dos módulos se hablan, lo hacen a través de un puerto o una interfaz.
    - **Composición.** La lógica se arma como una serie de pasos con una responsabilidad cada uno, y sumar un paso no obliga a tocar los que ya funcionan.
    - **Eventos entre componentes.** Los componentes se avisan por un bus de eventos. En rate-guardian, el gateway nunca importa al logger.
    - **Tests sobre el comportamiento.** Un refactor tiene que poder pasar la suite sin cambios. Si la rompe, el test estaba atado a cómo está escrito el código.
    - **Dependencias armadas en un solo lugar.** Se arman en un composition root, y así cada pieza se prueba sin levantar el sistema entero.
    - **Configuración por variables de entorno**, validada antes del deploy.
    - **El modelo como una dependencia más, de las que fallan.** Propone, y reglas fijas deciden antes de que algo se ejecute. Su calidad se mide en CI contra casos grabados, y cuando el sistema no está seguro, frena y le pasa el caso a una persona.
    - **Números medidos.** Si no tengo una métrica, describo el resultado con palabras.
  en: |
    - **Layers with written contracts.** The transport layer knows nothing about the data layer. When two modules talk, they do it through a port or an interface.
    - **Composition.** Logic is built as a series of steps with one responsibility each, and adding a step does not mean touching the ones that already work.
    - **Events between components.** Components notify each other over an event bus. In rate-guardian, the gateway never imports the logger.
    - **Tests on behavior.** A refactor has to pass the suite unchanged. If it breaks it, the test was tied to how the code is written.
    - **Dependencies wired in one place.** They are wired in a composition root, so each piece can be tested without standing up the whole system.
    - **Configuration through environment variables**, validated before deploy.
    - **The model as one more dependency, and one that fails.** It proposes, and fixed rules decide before anything runs. Its quality is measured in CI against recorded cases, and when the system is not sure, it stops and hands the case to a person.
    - **Measured numbers.** When I do not have a metric, I describe the result in words.


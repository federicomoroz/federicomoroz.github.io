- id: rpg-turn-based-battler
  name: RPG Turn-Based Battler
  short:
    es: "Motor de combate por turnos para un RPG 2D. Capa de datos en ScriptableObjects con clonado en runtime (Flyweight), esqueleto de ejecución de skills en 4 fases (Template Method), estrategias de movimiento intercambiables, pool genérico por reflection y pipeline de modificadores de daño (Chain of Responsibility)."

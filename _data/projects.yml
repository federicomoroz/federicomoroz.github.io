- id: arcasim
  used_by: [comanda]
  group: service
  cover: arcasim.webp
  cover_alt: "Panel de ArcaSim con los contribuyentes ficticios, los certificados, las fallas a pedido y los comprobantes emitidos"
  name: ArcaSim
  short:
    es: "Los web services de ARCA para desarrollar y probar sin ARCA. Una aplicación que factura usa su cliente real (WSAA para el ticket de acceso, WSFEv1 para el CAE) contra ArcaSim, y para pasar a producción se cambian dos direcciones y el certificado. Responde con los WSDL oficiales y con los errores y textos reales: un CAE aprobado coincide byte a byte con una respuesta grabada de ARCA, salvo el número. Se usa solo con los endpoints, como ARCA: cualquier certificado con CUIT entra y lo demás se crea al usarlo. Desde su panel se tira el servicio, se fuerza un rechazo, se corta la respuesta después de otorgar el CAE o se lo satura con un límite de pedidos y una cola, con un medidor en vivo. .NET 8 con una capa SOAP propia, 72 tests."
    en: "ARCA's web services, for developing and testing without ARCA, Argentina's tax authority. An application that invoices uses its real client (WSAA for the access ticket, WSFEv1 for the CAE) against ArcaSim, and going to production means changing two addresses and the certificate. It answers with the official WSDL files and the real errors and texts: an approved CAE matches a recorded ARCA response byte for byte, except the number. It is used through its endpoints alone, like ARCA: any certificate with a CUIT gets in and the rest is created on use. Its panel takes the service down, forces a rejection, drops the answer after granting the CAE, or saturates it with a request limit and a queue, with a live meter. .NET 8 with its own SOAP layer, 72 tests."
  card:
    es: "Los web services de ARCA para desarrollar y probar: mismo protocolo, mismos errores y fallas a pedido. Para pasar a producción se cambian dos direcciones y el certificado, no el código."

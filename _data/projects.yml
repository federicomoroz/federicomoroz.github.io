- id: order-outbox-service
  group: service
  cover: order-outbox-service.webp
  cover_alt: "Dashboard de Order Outbox Service con la cola de eventos"
  name: Order Outbox Service
  short:
    es: "Dos microservicios en Java y Spring Boot que resuelven el dual write: el pedido y su evento se escriben en un mismo commit de Postgres, y un relay aparte los publica a Kafka reintentando con backoff. Si el broker está caído el pedido igual entra, y el evento se publica solo cuando vuelve. El consumidor deduplica por event_id, así el reintento no duplica efectos. Diez tests de ArchUnit hacen cumplir las reglas hexagonales y fallan el build si alguien las rompe."
    en: "Two Java and Spring Boot microservices solving the dual write problem: the order and its event are written in a single Postgres commit, and a separate relay publishes them to Kafka with exponential backoff. If the broker is down the order still succeeds, and the event publishes itself once it returns. The consumer dedupes by event_id, so a retry never duplicates effects. Ten ArchUnit tests enforce the hexagonal rules and fail the build if anyone breaks them."
  card:
    es: "Dos microservicios en Java y Spring Boot que guardan un pedido y le avisan a otro servicio por Kafka, sin perder ni duplicar el evento."
    en: "Two Java and Spring Boot microservices that save an order and notify another service over Kafka, without losing or duplicating the event."
  reading:
    num: { es: "1 commit", en: "1 commit" }
    what:
      es: "guarda el pedido y su evento juntos: con Kafka caído el pedido entra igual y el evento sale cuando vuelve"
      en: "saves the order and its event together: with Kafka down the order still goes in and the event goes out when it returns"

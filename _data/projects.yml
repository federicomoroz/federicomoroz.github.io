- id: shipping-quote-dotnet
  name: "Shipping Quote — .NET"
  short:
    es: "Un port, no una pieza nueva: el mismo cotizador de envíos que existe en Python, reescrito en ASP.NET Core para ver qué partes eran arquitectura y cuáles eran costumbre. Los tres transportistas se consultan con `Task.WhenAll` y hay un test que mide el reloj —306 ms donde en fila serían 900— así que falla si alguien lo convierte en un `foreach`. Corre sobre MySQL, no SQLite, porque SQLite serializa las escrituras."
    en: "A port, not a new piece: the same shipping quoter that exists in Python, rewritten in ASP.NET Core to see which parts were architecture and which were habit. The three carriers are queried with `Task.WhenAll`, and a test measures the clock —306 ms where sequential would be 900— so it fails if anyone turns it into a `foreach`. It runs on MySQL rather than SQLite, because SQLite serializes writes."
  status: active
  listed: true
  case_study: true
  repo: https://github.com/federicomoroz/shipping-quote-dotnet
  repo_visibility: public
  tech:
    - "C#"
    - .NET 8
    - ASP.NET Core
    - EF Core
    - MySQL
    - Testcontainers
    - xUnit
    - Docker


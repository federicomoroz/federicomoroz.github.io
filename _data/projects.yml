- id: rate-guardian
  name: Rate Guardian
  short:
    es: "API gateway con rate limiting de ventana deslizante (sorted sets de Redis), circuit breaker respaldado en Redis, proxy HTTP transparente y dashboard de terminal en tiempo real. El gateway nunca importa el logger: el logging va por un bus pub/sub."
    en: "API gateway with sliding-window rate limiting (Redis sorted sets), Redis-backed circuit breaker, transparent HTTP proxy and a real-time terminal dashboard. The gateway never imports the logger — logging goes through a pub/sub bus."

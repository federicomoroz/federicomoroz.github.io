- id: nexo
  name: Nexo
  short:
    es: "Un mayorista mandaba el catálogo por FTP una vez por día y el stock quedaba viejo antes del mediodía. Acá el ERP publica y los revendedores bajan el catálogo por WebSocket, con confirmación por lote, y quedan en la misma conexión recibiendo los cambios. La persistencia está detrás de puertos: los mismos 24 casos corren contra MySQL, PostgreSQL, SQLite y un proveedor en memoria, y ya encontraron dos divergencias entre motores. Un benchmark propio refutó la justificación del primer ADR y el documento quedó corregido."
    en: "A wholesaler was sending its catalogue over FTP once a day, and stock was stale by noon. Here the ERP publishes and resellers pull the catalogue over a WebSocket, batch by batch with acknowledgements, then stay on that connection receiving changes. Persistence sits behind ports: the same 24 cases run against MySQL, PostgreSQL, SQLite and an in-memory provider, and they have already caught two engine divergences. A benchmark refuted the reasoning in the first ADR, and the document was corrected rather than quietly dropped."
  status: active
  listed: true
  case_study: true
  repo: https://github.com/federicomoroz/nexo
  repo_visibility: public
  demo: https://federicomoroz.github.io/nexo/
  tech:
    - "C#"
    - .NET 8
    - ASP.NET Core MVC
    - WebSocket
    - SSE
    - EF Core
    - MySQL
    - PostgreSQL
    - Testcontainers
    - xUnit
    - Docker

- id: order-outbox-service
  name: Order Outbox Service
  short:
    es: "Dos microservicios en Java y Spring Boot que resuelven el dual write: el pedido y su evento se escriben en un mismo commit de Postgres, y un relay aparte los publica a Kafka reintentando con backoff. Si el broker está caído el pedido igual entra, y el evento se publica solo cuando vuelve. El consumidor deduplica por event_id, así el reintento no duplica efectos. Las reglas hexagonales no son un acuerdo: son diez tests de ArchUnit que fallan el build."
    en: "Two Java and Spring Boot microservices solving the dual write problem: the order and its event are written in a single Postgres commit, and a separate relay publishes them to Kafka with exponential backoff. If the broker is down the order still succeeds, and the event publishes itself once it returns. The consumer dedupes by event_id, so a retry never duplicates effects. The hexagonal rules are not a convention: they are ten ArchUnit tests that fail the build."
  status: active
  listed: true
  case_study: true
  repo: https://github.com/federicomoroz/order-outbox-service
  repo_visibility: public
  tech:
    - Java 21
    - Spring Boot
    - Kafka
    - PostgreSQL
    - Testcontainers
    - ArchUnit
    - React
    - Docker


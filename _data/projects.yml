# Metadata de proyectos (manual).
#
# Campos:
#   id              -> slug PUBLICO y estable. Para trabajo con NDA nunca codifica
#                      el nombre del cliente. La pagina de detalle sale de este id.
#   listed          -> true lo muestra en /projects/ y en el preview del home.
#                      Ponerlo en false oculta el proyecto sin borrar la pagina.
#   case_study      -> true agrega el link "Leer case study" y requiere las paginas
#                      es/projects/<id>.md + en/projects/<id>.md.
#   repo_visibility -> public linkea el repo; private muestra la etiqueta "repo privado".
#                      Un proyecto se puede listar con el repo privado: el write-up
#                      es el artefacto publico.
#   short.{es,en}   -> resumen de UNA linea por idioma.
#   status          -> active | paused | done  (se traduce via i18n.status).
#   tech            -> chips de stack, neutrales (mismos en ambos idiomas).
#
# REGLA: no inventar metricas. Si no hay un numero real medido, se describe
# cualitativamente. Los numeros de abajo salen del README publico de GitHub.
#
# ESTADO: seed desde el README publico. Revisar textos y sumar los que falten.

- id: agente-contracargos
  name: "Agente de investigación de contracargos"
  short:
    es: "Ante un contracargo, reúne la transacción, sus logs, las políticas que aplican, qué se resolvió en casos parecidos y el historial del cliente; propone una resolución justificada y se autoevalúa con un juez LLM. Los casos de riesgo alto frenan y esperan a un analista. Orquestado en n8n sobre una API FastAPI con RAG en Qdrant."
    en: "Given a chargeback, it gathers the transaction, its logs, the applicable policies, how similar cases were resolved and the customer's history; proposes a justified resolution and grades itself with an LLM judge. High-risk cases stop and wait for a human analyst. Orchestrated in n8n over a FastAPI service with RAG on Qdrant."
  status: active
  listed: true
  case_study: true
  repo: https://github.com/federicomoroz/ciri-api-aux-sourcecode
  repo_visibility: public
  demo: https://ciri-chargeback-agent.onrender.com/panel
  tech:
    - Python
    - FastAPI
    - n8n
    - Claude
    - Qdrant
    - RAG
    - Docker
    - pytest

- id: mega-training-system
  name: Mega Training System
  short:
    es: "Generador de planes de entrenamiento sobre la API de Claude. Nació como herramienta para un instructor de indoor cycling y hoy lo usa Megatlon en su operación diaria. Arquitectura de plugins: sumar una disciplina es un `plugin.py` y su agent, sin tocar el core. Streaming SSE, catálogo de ejercicios inyectado como knowledge base y Batch API para bajar el costo a la mitad."
    en: "Training plan generator built on the Claude API. It started as a tool for one indoor cycling instructor and is now used by Megatlon in daily operation. Plugin architecture: adding a discipline is a `plugin.py` plus its agent, with no changes to the core. SSE streaming, an exercise catalogue injected as a knowledge base, and the Batch API to halve the cost."
  status: active
  listed: true
  case_study: true
  repo: https://github.com/federicomoroz/MegaTrainingSystem
  repo_visibility: public
  tech:
    - Python
    - Flask
    - Claude
    - SSE
    - PostgreSQL
    - Docker
    - pytest

- id: task-queue
  name: Task Queue
  short:
    es: "Cola de tareas distribuida con API en FastAPI, broker Redis (LPUSH/BRPOP), persistencia en SQLite y workers escalables horizontalmente. Arquitectura multi-contenedor: los workers escalan con `--scale worker=N` sin tocar código."
    en: "Distributed task queue with a FastAPI API server, Redis broker (LPUSH/BRPOP), SQLite persistence and horizontally scalable workers. Multi-container architecture: workers scale with `--scale worker=N` without touching any code."
  status: active

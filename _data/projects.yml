- id: handoff
  group: service
  cover: handoff.webp
  cover_alt: "Diagrama del circuito de handoff: el modelo propone y once reglas deciden, con 19 intentos de mover plata frenados"
  name: handoff
  short:
    es: "Un cliente escribe «me llegó roto». Para contestarle hay que mirar el pedido, el envío, cuántas veces reclamó antes y qué anotó el depósito, y recién ahí decidir si se le manda otro, se le devuelve la plata, se le pide una foto o lo mira una persona. handoff hace esas cuatro consultas contra un sistema que contesta mal a propósito, y decide en dos segundos: en ocho de cada diez casos la decisión es la que correspondía, y cuando los datos no alcanzan el reclamo llega a una persona ya armado. Once reglas revisan cada propuesta antes de que ocurra, así que ninguna devolución sale sin respaldo."
    en: "A customer writes «it arrived broken». To answer them someone has to look at the order, the shipment, how many times that customer claimed before and what the warehouse wrote down, and only then decide between a replacement, a refund, asking for a photo, or handing it to a person. handoff does those four reads against a system built to answer badly, and decides in two seconds: in eight cases out of ten the decision is the right one, and when the facts fall short the claim reaches a person already assembled. Eleven rules review every proposal before it happens, so no refund ever goes out without backing."
  card:
    es: "Ante un reclamo, hace las cuatro consultas que hacen falta contra un ERP que contesta mal y propone qué hacer. Once reglas revisan la propuesta antes de que ocurra."
    en: "Given a claim, it makes the four reads it takes against an ERP that answers badly and proposes what to do. Eleven rules check the proposal before it happens."

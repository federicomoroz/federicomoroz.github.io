# Metadata de proyectos (manual).
#
# Campos:
#   id              -> slug PUBLICO y estable. Para trabajo con NDA nunca codifica
#                      el nombre del cliente. La pagina de detalle sale de este id.
#   listed          -> true lo muestra en /projects/ y en el preview del home.
#                      Ponerlo en false oculta el proyecto sin borrar la pagina.
#   case_study      -> true agrega el link "Leer case study" y requiere las paginas
#                      es/projects/<id>.md + en/projects/<id>.md.
#   repo_visibility -> public linkea el repo; private muestra la etiqueta "repo privado".
#                      Un proyecto se puede listar con el repo privado: el write-up
#                      es el artefacto publico.
#   short.{es,en}   -> resumen de UNA linea por idioma.
#   status          -> active | paused | done  (se traduce via i18n.status).
#   tech            -> chips de stack, neutrales (mismos en ambos idiomas).
#   cover           -> archivo en assets/img/covers/ (16:9, webp). OPCIONAL: si
#                      falta, la tarjeta dibuja una portada tipografica con el
#                      primer chip de `tech`. Se declara a mano porque Liquid no
#                      puede preguntar si un archivo existe, y un src roto es
#                      peor que no tener portada.
#   cover_alt       -> texto alternativo de esa imagen. Obligatorio si hay cover.
#   card.{es,en}    -> texto corto para la tarjeta (si falta, usa `short`, que
#                      tambien es lo que contesta el asistente).
#   reading         -> el numero medido que define al proyecto: num + what.
#   group           -> OPCIONAL. `service`: una pieza para usar en otros sistemas
#                      (notificaciones, colas, gateways, un patron de mensajeria). Sale en
#                      /tools/ ("Servicios y herramientas") y no en /projects/
#                      ("Aplicaciones"), que es para apps completas para el usuario final.
#   used_by         -> OPCIONAL, lista de ids de proyectos que usan este servicio. La
#                      tarjeta lo muestra como "Lo usa: ...".
#   docs            -> OPCIONAL: repo publico con la documentacion de un proyecto de
#                      codigo privado. La tarjeta lo linkea junto a "repo privado".
#   live            -> vista previa animada en la tarjeta: src en assets/img/,
#                      kind = diagram (GIF que se ve entero) | scroll (captura
#                      alta que se recorre).
#
# REGLA: no inventar metricas. Si no hay un numero real medido, se describe
# cualitativamente. Los numeros de abajo salen del README publico de GitHub.
#
# ESTADO: seed desde el README publico. Revisar textos y sumar los que falten.

- id: agente-contracargos
  cover: agente-contracargos.webp
  cover_alt: "Panel del agente de contracargos, con el caso y su resolución propuesta"
  name: "Agente de investigación de contracargos"
  short:
    es: "Ante un contracargo, reúne la transacción, sus logs, las políticas que aplican, qué se resolvió en casos parecidos y el historial del cliente. Con eso propone una resolución justificada, y un juez LLM la evalúa. Los casos de riesgo alto frenan y esperan a un analista. Orquestado en n8n sobre una API FastAPI con RAG en Qdrant."
    en: "Given a chargeback, it gathers the transaction, its logs, the applicable policies, how similar cases were resolved and the customer's history. From that it proposes a justified resolution, which an LLM judge then grades. High-risk cases stop and wait for a human analyst. Orchestrated in n8n over a FastAPI service with RAG on Qdrant."
  card:
    es: "Ante un contracargo, reúne la transacción, sus logs, las políticas que aplican y los casos parecidos, y propone una resolución justificada. Los casos de riesgo alto esperan a un analista."
